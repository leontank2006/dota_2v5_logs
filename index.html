<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="js/chart.js"></script>
  <title>Dota 2V5
  </title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
       <header class="hero" id="header"></header>

    <section class="section">
      <h2 class="section-title">大数字</h2>
      <div class="stat-grid" id="summary"></div>
      <div class="coverage-grid" id="coverage"></div>
      <div class="stat-grid" id="summaryExtra" style="margin-top:16px"></div>
    </section>

    <section class="section">
      <h2 class="section-title">玩家跨局汇总 <span class="hint">A / B 重点展示</span></h2>
      <div class="player-cards" id="playerCards"></div>
    </section>

    <section class="section">
      <h2 class="section-title">我方英雄池（A / B）</h2>
      <div class="charts-grid" id="heroPool"></div>
    </section>

    <section class="section">
      <h2 class="section-title">我方绝活榜 <span class="hint">A / B 按场均经济取前 3 英雄</span></h2>
      <div class="mastery-row" id="masteryBoard"></div>
    </section>

    <section class="section">
      <h2 class="section-title">AI 强度榜 <span class="hint">机器人使用英雄 · 按打钱能力取前 10</span></h2>
      <div class="ai-rank-row" id="aiRank"></div>
    </section>

    <section class="section">
      <h2 class="section-title">GPM 跨局趋势</h2>
      <div class="chart-card">
        <div style="position:relative;height:300px"><canvas id="gpmTrend"></canvas></div>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">逐局明细 <span class="hint">点击列头排序</span></h2>
      <div class="custom-table-wrap" id="matchTableWrap">
        <div class="custom-table-scroll" id="matchTableScroll">
          <table class="custom-table" id="matchTable">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">数据洞察</h2>
      <ul class="insights" id="insights"></ul>
        <div class="chart-card" style="margin-top:16px">
        <h3 style="font-size:15px;margin-bottom:12px;color:var(--muted)">指标 vs 胜负（散点图）</h3>
        <div class="scatter-grid">
          <div class="scatter-cell">
            <div class="scatter-title">比赛时长 vs 胜负</div>
            <div style="position:relative;height:240px"><canvas id="scatterDuration"></canvas></div>
          </div>
          <div class="scatter-cell">
            <div class="scatter-title">队伍得分比 vs 胜负</div>
            <div style="position:relative;height:240px"><canvas id="scatterScoreRatio"></canvas></div>
          </div>
          <div class="scatter-cell">
            <div class="scatter-title">队伍平均 GPM vs 胜负</div>
            <div style="position:relative;height:240px"><canvas id="scatterGPM"></canvas></div>
          </div>
          <div class="scatter-cell">
            <div class="scatter-title">队伍平均等级 vs 胜负</div>
            <div style="position:relative;height:240px"><canvas id="scatterLevel"></canvas></div>
          </div>
        </div>
        <div style="font-size:12px;color:var(--muted);margin-top:8px">横轴为对局指标，纵轴 0=负 / 1=胜。点越靠右说明该指标值越高，越靠上说明赢了。</div>
      </div>
    </section>
  </div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
